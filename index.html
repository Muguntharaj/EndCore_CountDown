<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#05070d">
<title>AVENGERS: ENDGAME — The Final Watch</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;background:#000}
body:before{content:"";position:fixed;inset:0;z-index:-3;background-image:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.7)),url("./background.jpg");background-size:cover;background-position:center;background-repeat:no-repeat}
body:after{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at center,transparent 15%,rgba(0,0,0,.25) 60%,rgba(0,0,0,.8) 100%);pointer-events:none}
.wrap{width:min(1100px,94vw);text-align:center;padding:30px 0}.badge{display:inline-block;padding:8px 16px;border:1px solid #ffffff55;border-radius:30px;background:#00000055;font-size:11px;letter-spacing:.25em;color:#ddd}
h1{margin:22px 0 8px;font-size:clamp(35px,7vw,82px);line-height:.95;letter-spacing:.06em;font-weight:900;text-shadow:0 4px 35px #000}h1 span{color:#e62429}
.subtitle{font-size:clamp(13px,2vw,18px);letter-spacing:.15em;color:#ddd;text-transform:uppercase}.date{margin:20px 0 28px;color:#ffd166;font-size:clamp(15px,2.2vw,22px);font-weight:800;letter-spacing:.08em}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:900px;margin:auto}.unit{padding:22px 10px;border-radius:18px;background:#00000066;border:1px solid #ffffff33;box-shadow:0 12px 45px #00000070;backdrop-filter:blur(10px)}
.num{font-size:clamp(42px,8vw,88px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.label{margin-top:10px;font-size:10px;letter-spacing:.25em;color:#bbb}
.actions{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin-top:24px}button,.share{border:1px solid #ffffff40;color:#fff;background:#00000088;padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:700;text-decoration:none;backdrop-filter:blur(8px)}button:hover,.share:hover{background:#ffffff22}.primary{background:#e62429;border-color:#e62429}.note{margin-top:14px;font-size:12px;color:#bbb}
@media(max-width:650px){.clock{grid-template-columns:repeat(2,1fr)}.unit{padding:18px 8px}}
</style>
</head>
<body>
<main class="wrap">
<div class="badge">THE FINAL WATCH </div>
<h1>AVENGERS: <span>ENDGAME ENCORE</span></h1>
<div class="subtitle">One last journey. One unforgettable watch.</div>
<div class="date">26 SEPTEMBER 2026 • 10:46 PM IST</div>
<section class="clock">
<div class="unit"><div class="num" id="days">00</div><div class="label">DAYS</div></div>
<div class="unit"><div class="num" id="hours">00</div><div class="label">HOURS</div></div>
<div class="unit"><div class="num" id="minutes">00</div><div class="label">MINUTES</div></div>
<div class="unit"><div class="num" id="seconds">00</div><div class="label">SECONDS</div></div>
</section>
<div class="actions">
<button class="primary" id="audioBtn">🎵 LETS PLAY THE ANTHEM</button>
<a class="share" id="wa" target="_blank" rel="noopener"> Share on WhatsApp</a>
<button id="copyBtn">🔗 Copy Link</button>
</div>
<div class="note" id="status">Using background.jpg and audio.mp3 from this GitHub repository.</div>
</main>
<audio id="soundtrack" src="./audio.mp3" preload="auto" loop></audio>
<script>
const target=new Date("2026-09-26T22:46:00+05:30").getTime();
function updateCountdown(){
 let r=Math.max(0,target-Date.now());
 let d=Math.floor(r/86400000);r%=86400000;
 let h=Math.floor(r/3600000);r%=3600000;
 let m=Math.floor(r/60000);r%=60000;
 let s=Math.floor(r/1000);
 document.getElementById("days").textContent=String(d).padStart(2,"0");
 document.getElementById("hours").textContent=String(h).padStart(2,"0");
 document.getElementById("minutes").textContent=String(m).padStart(2,"0");
 document.getElementById("seconds").textContent=String(s).padStart(2,"0");
 if(target-Date.now()<=0){document.querySelector(".subtitle").textContent="IT'S TIME. ASSEMBLE.";document.querySelector(".date").textContent="THE FINAL WATCH HAS BEGUN";}
}
updateCountdown();setInterval(updateCountdown,1000);
const audio=document.getElementById("soundtrack"),btn=document.getElementById("audioBtn");
btn.onclick=async()=>{try{if(audio.paused){await audio.play();btn.textContent="🔊 Soundtrack On";document.getElementById("status").textContent="Your uploaded repository soundtrack is playing."}else{audio.pause();btn.textContent="🎵 Play Soundtrack";document.getElementById("status").textContent="Soundtrack paused."}}catch(e){document.getElementById("status").textContent="Audio could not be played. Check that audio.mp3 exists in the repository."}};
document.getElementById("wa").href="https://wa.me/?text="+encodeURIComponent("⚡ AVENGERS: ENDGAME — THE FINAL WATCH ⚡\n26 September 2026 • 10:46 PM IST\nTHE COUNTDOWN IS LIVE. ASSEMBLE! 🛡️\n\n"+location.href);
document.getElementById("copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById("copyBtn").textContent="✅ Link Copied";setTimeout(()=>document.getElementById("copyBtn").textContent="🔗 Copy Link",1800)}catch(e){document.getElementById("status").textContent="Copy failed. Copy the address from your browser."}};
</script>
</body>
</html>
